version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
    groups:
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
