name: Import AcMP Dropbox Excel

on:
  schedule:
    # Runs every 15 minutes, offset from GitHub's busiest cron boundaries.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: acmp-dropbox-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run import:dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          ACMP_DROPBOX_IMPORT_PATH: ${{ secrets.ACMP_DROPBOX_IMPORT_PATH }}
          ACMP_DROPBOX_FAILED_PATH: ${{ secrets.ACMP_DROPBOX_FAILED_PATH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
